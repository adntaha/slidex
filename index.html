<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIVE DECK</title>
<style>
.slide-content{position:relative;z-index:1}.slide-image{display:none}.slide.has-image .slide-image{display:block}.image-background .slide-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.24}.image-background::after{content:"";position:absolute;inset:0;background:#fff9}.image-left .slide-image,.image-right .slide-image{position:absolute;top:15%;width:36%;height:70%;object-fit:cover}.image-left .slide-image{left:8%}.image-right .slide-image{right:8%}.image-left .slide-content{margin-left:38%}.image-right .slide-content{max-width:55%}
:root{color:#202124;background:#f1f3f4;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:#f1f3f4}header{height:54px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #dadce0}h1,h2,p{margin:0}h1{color:#5f6368;font-size:.78rem;letter-spacing:.08em}#status{color:#188038;font:700 .7rem "Courier New",monospace}#stage{min-height:calc(100vh - 54px);padding:clamp(18px,4vh,46px) clamp(14px,6vw,96px) 76px;display:grid;place-items:center}main{width:min(100%,1240px);aspect-ratio:16/9;position:relative;background:#fff;box-shadow:0 3px 15px #2021242b;overflow:hidden}.slide{position:absolute;inset:0;padding:clamp(30px,6vw,104px);display:grid;grid-template-columns:74px 1fr;gap:clamp(20px,3vw,46px);align-content:center;opacity:0;pointer-events:none;transform:translateX(5%);transition:opacity 260ms ease,transform 360ms cubic-bezier(.2,.8,.2,1)}.slide.is-active{opacity:1;pointer-events:auto;transform:translateX(0)}.slide.is-new.is-active{animation:slide-in 480ms cubic-bezier(.16,1,.3,1)}.slide-number{color:#5f6368;font:700 clamp(.65rem,1.1vw,.9rem) "Courier New",monospace;letter-spacing:.08em;border-right:1px solid #dadce0;padding-top:.5em}.slide-content{min-width:0}h2{max-width:18ch;font-size:clamp(2rem,6.2vw,6.5rem);line-height:.94;letter-spacing:-.065em;font-weight:700}ul{margin:clamp(24px,5vh,62px) 0 0;padding:0;list-style:none;display:grid;gap:clamp(11px,1.7vh,21px);max-width:60ch}li{color:#3c4043;font-size:clamp(1rem,2vw,1.7rem);line-height:1.2;display:grid;grid-template-columns:18px 1fr;gap:12px}li::before{content:"•";color:#4285f4;font-size:1.35em;line-height:.75}.title-slide{grid-template-columns:1fr}.title-slide .slide-number,.title-slide ul{display:none}.title-slide h2{max-width:14ch;font-size:clamp(3.1rem,9vw,9.5rem)}.title-slide h2::after{content:"LIVE PRESENTATION";display:block;margin-top:1.5rem;color:#4285f4;font-size:.12em;letter-spacing:.12em}li.is-new{animation:item-in 360ms cubic-bezier(.16,1,.3,1) both}.is-edited{animation:edited 700ms ease-out}.empty{width:100%;height:100%;display:grid;place-items:center;color:#5f6368;font-size:clamp(1.2rem,3vw,2.2rem)}#controls{position:fixed;z-index:2;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;border:1px solid #dadce0;border-radius:24px;background:#fff;box-shadow:0 2px 8px #20212420}button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#3c4043;cursor:pointer;font-size:1.4rem}button:hover:not(:disabled){background:#f1f3f4}button:disabled{color:#bdc1c6;cursor:default}#position{min-width:54px;color:#5f6368;font: .75rem "Courier New",monospace;text-align:center}@keyframes slide-in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@keyframes item-in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}@keyframes edited{0%{background:#fff3c4;transform:translateX(-5px)}100%{background:transparent;transform:translateX(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}@media(max-width:620px){header{padding:0 14px}#stage{padding:20px 10px 72px}main{aspect-ratio:4/3}.slide{grid-template-columns:1fr;gap:8px;padding:30px}.slide-number{border:0;padding:0}}
</style></head><body>
<header><h1>LIVE DECK</h1><p id="status">CONNECTING</p></header><div id="stage"><main id="slides"><div class="empty">Listening for a topic...</div></main></div><nav id="controls" aria-label="Presentation controls"><button id="previous" aria-label="Previous slide">‹</button><span id="position">— / —</span><button id="next" aria-label="Next slide">›</button></nav>
<script>
const slides=document.getElementById("slides"),status=document.getElementById("status"),previousButton=document.getElementById("previous"),nextButton=document.getElementById("next"),position=document.getElementById("position");let previous="",activeIndex=0;const shown=new Set();
function element(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}function animateEdit(node){node.classList.remove("is-edited");void node.offsetWidth;node.classList.add("is-edited")}function paintImage(card,image){const existing=card.querySelector(".slide-image");card.classList.remove("has-image","image-background","image-left","image-right");if(!image){existing?.remove();return}const node=existing??card.appendChild(element("img","slide-image"));if(node.getAttribute("src")!==image.url)node.src=image.url;node.alt=image.alt;node.title=`Image source: ${image.source}`;card.classList.add("has-image",`image-${image.placement}`)}function select(index){const cards=[...slides.querySelectorAll(".slide")];activeIndex=Math.max(0,Math.min(index,cards.length-1));cards.forEach((card,i)=>card.classList.toggle("is-active",i===activeIndex));position.textContent=cards.length?`${activeIndex+1} / ${cards.length}`:"— / —";previousButton.disabled=activeIndex===0;nextButton.disabled=!cards.length||activeIndex===cards.length-1}
function render(deck){const fingerprint=JSON.stringify(deck.slides);if(fingerprint===previous)return;previous=fingerprint;if(!deck.slides.length){if(!slides.querySelector(".empty"))slides.replaceChildren(element("div","empty","Listening for a topic..."));select(0);return}slides.querySelector(".empty")?.remove();const existing=new Map([...slides.querySelectorAll(".slide")].map(card=>[card.dataset.slide,card]));
// A slide id the page has never drawn is one the speaker just created; its
// position can be anywhere, because the title slide is inserted at the front.
let created=-1;deck.slides.forEach((slide,index)=>{const key=String(slide.id);let card=existing.get(key);if(!card){card=element("article","slide is-new");card.dataset.slide=key;card.append(element("div","slide-number"));const content=element("div","slide-content");content.append(element("h2"));content.append(element("ul"));card.append(content)}if(!shown.has(key)){shown.add(key);created=index}card.classList.toggle("title-slide",slide.kind==="title");card.querySelector(".slide-number").textContent=`SLIDE ${String(slide.number).padStart(2,"0")}`;const title=card.querySelector("h2");if(title.textContent&&title.textContent!==slide.title)animateEdit(title);title.textContent=slide.title;const list=card.querySelector("ul"),oldItems=[...list.children];slide.bullets.forEach((bullet,rank)=>{let item=oldItems[rank];if(!item){item=element("li","is-new",bullet);list.append(item)}else if(item.textContent!==bullet){item.textContent=bullet;animateEdit(item)}});oldItems.slice(slide.bullets.length).forEach(item=>item.remove());paintImage(card,slide.image);slides.append(card);existing.delete(key)});existing.forEach(card=>card.remove());select(created===-1?activeIndex:created)}
previousButton.addEventListener("click",()=>select(activeIndex-1));nextButton.addEventListener("click",()=>select(activeIndex+1));document.addEventListener("keydown",event=>{if(["ArrowLeft","ArrowUp"].includes(event.key))select(activeIndex-1);if(["ArrowRight","ArrowDown"," "].includes(event.key)){event.preventDefault();select(activeIndex+1)}});async function refresh(){try{const response=await fetch("/api/slides",{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status}`);render(await response.json());status.textContent="LIVE / LISTENING"}catch(error){status.textContent="RECONNECTING"}}refresh();setInterval(refresh,500);
</script></body></html>
